<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>万缕千丝游玩手记</title>
<style>
  html,body{margin:0;height:100%}
  body{display:grid;place-items:center;background:#f3ecdc;color:#6b5a43;font:15px/1.7 -apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif}
  @media (prefers-color-scheme: dark){body{background:#16130f;color:#c4b598}}
  .box{text-align:center;padding:24px}
  .box b{display:block;font:700 22px/1.4 "Songti SC","Noto Serif CJK SC",serif;letter-spacing:.08em;margin-bottom:6px}
</style>
</head>
<body>
<div class="box"><b>万缕千丝</b><span id="msg">正在加载…</span></div>
<script>
/* 外壳页：从 Supabase 读取最新的网页代码并运行。之后改网页只需要更新 Supabase 里的 app_files 表，这个文件不用再改。 */
(function () {
  var URL_ = "https://cibhyqwzvynlwvrfmilf.supabase.co/rest/v1/app_files?name=eq.app&select=body,updated_at";
  var KEY = "sb_publishable_7R69x027P67KqksqAIXTcg_98jDXBeB";
  var CACHE = "fw-app-cache-v1";
  function run(body) { document.open(); document.write(body); document.close(); }
  function cached() { try { var c = JSON.parse(localStorage.getItem(CACHE) || "null"); return c && c.body ? c : null; } catch (e) { return null; } }
  function fail() {
    var c = cached();
    if (c) { run(c.body); return; }
    document.getElementById("msg").textContent = "加载失败，检查网络后刷新。如果很久没打开，数据库可能在休眠，需要到 Supabase 后台点恢复。";
  }
  var ctrl = typeof AbortController === "function" ? new AbortController() : null;
  var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 12000);
  fetch(URL_, { headers: { apikey: KEY, Authorization: "Bearer " + KEY }, cache: "no-store", signal: ctrl ? ctrl.signal : undefined })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (rows) {
      clearTimeout(timer);
      if (!rows || !rows.length || !rows[0].body) throw new Error("empty");
      try { localStorage.setItem(CACHE, JSON.stringify(rows[0])); } catch (e) {}
      run(rows[0].body);
    })
    .catch(function () { clearTimeout(timer); fail(); });
})();
</script>
</body>
</html>
